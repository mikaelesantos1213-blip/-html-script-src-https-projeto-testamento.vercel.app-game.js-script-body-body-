<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Projeto Testamento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background: #05000a; color: #fff; font-family: serif; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .orb { background: radial-gradient(circle, #1a0b3c, #05000a); border: 1px solid rgba(168, 85, 247, 0.2); box-shadow: 0 0 40px rgba(168, 85, 247, 0.2); border-radius: 50%; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="babel">
        const { useState } = React;
        function App() {
            const [view, setView] = useState('login');
            const [nick, setNick] = useState('');
            const [input, setInput] = useState('');
            const [resp, setResp] = useState("O Oráculo aguarda...");
            const ask = () => {
                if (!input.trim()) return;
                setResp("Lendo o destino...");
                setTimeout(() => {
                    const frases = ["O destino sorri para ti.", "As trevas guardam segredos.", "O amanhã será diferente."];
                    setResp(frases[Math.floor(Math.random() * frases.length)]);
                    setInput('');
                }, 1500);
            };
            return (
                <div className="flex flex-col items-center justify-center p-6 text-center">
                    {view === 'login' ? (
                        <div className="bg-zinc-900/80 p-10 rounded-[3rem] border border-purple-500/20 shadow-2xl">
                            <h2 className="text-xl mb-8 italic font-bold">O PORTAL</h2>
                            <input className="w-full bg-black border border-purple-900 p-4 rounded-xl text-center mb-4 outline-none text-white uppercase" placeholder="NICKNAME" onChange={e => setNick(e.target.value.toUpperCase())}/>
                            <button onClick={() => nick && setView('game')} className="w-full bg-purple-900 py-4 rounded-xl font-bold uppercase tracking-widest">Entrar</button>
                        </div>
                    ) : (
                        <div className="flex flex-col items-center">
                            <p className="mb-8 text-purple-400 font-bold tracking-widest uppercase italic">{nick}</p>
                            <div className="w-64 h-64 orb flex items-center justify-center p-8 italic text-sm leading-relaxed">{resp}</div>
                            <div className="mt-12 relative flex items-center bg-zinc-900 rounded-2xl px-4 border border-white/5">
                                <input className="bg-transparent p-5 outline-none uppercase text-[10px] w-full text-white" placeholder="Sussurra..." value={input} onChange={e => setInput(e.target.value)}/>
                                <button onClick={ask} className="bg-purple-900 px-4 py-2 rounded-xl font-black text-[10px] uppercase">Ler</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
